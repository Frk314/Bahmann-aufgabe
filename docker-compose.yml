# Start the map with one command:
#   docker compose up --build
# Then open http://localhost:5173/carte
#
# Ports match local development: the frontend calls the API at localhost:8000
# (web/.env), and the API only accepts requests from localhost:5173 (CORS).

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Re-running pipeline/export.py updates the map without a rebuild
      # (the API re-reads the file on every request).
      - ./data/providers.json:/app/data/providers.json:ro

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api
